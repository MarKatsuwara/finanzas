server:
  # El puerto de la API. Los servidores como Render dicen cuál usar con la variable PORT.
  port: ${PORT:8080}

spring:
  application:
    name: finanzas
  datasource:
    # La dirección de la base de datos. Si no hay variable DB_URL, la de tu ordenador.
    # (En Docker y en el servidor se pone DB_URL con la suya.)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finanzas}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

finanzas:
  jwt:
    # La clave secreta para firmar las sesiones. Va en una variable de entorno, NUNCA aquí.
    secreto: ${JWT_SECRET:}
  google:
    # El ID de cliente de Google (no es secreto: también va en la web).
    id-cliente: ${GOOGLE_CLIENT_ID:381598543863-u49204encja2rjs5l7lk9gb4t01jg5ug.apps.googleusercontent.com}
